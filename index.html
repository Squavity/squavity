<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQUAVITY — Gravity-Flipping Precision Platformer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange:#FF6B00; --orange-bright:#FF8C00; --orange-glow:#FF4500; --orange-dim:#993F00;
    --black:#000; --black-soft:#0A0A0A; --black-card:#111; --black-border:#1e1e1e;
    --text:#FFF; --text-dim:#777;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--text);font-family:'Space Mono',monospace;overflow-x:hidden;cursor:none;}

  .cursor{width:14px;height:14px;background:var(--orange);position:fixed;top:0;left:0;pointer-events:none;z-index:9999;transition:transform 0.1s;}
  .cursor-trail{width:7px;height:7px;background:var(--orange-glow);opacity:0.4;position:fixed;top:0;left:0;pointer-events:none;z-index:9998;transition:top 0.12s ease,left 0.12s ease;}

  /* NAV */
  nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:18px 60px;background:linear-gradient(to bottom,rgba(0,0,0,0.97),transparent);border-bottom:1px solid rgba(255,107,0,0.12);}
  .nav-logo img{height:36px;filter:drop-shadow(0 0 10px rgba(255,107,0,0.6));}
  .nav-links{display:flex;gap:40px;list-style:none;}
  .nav-links a{color:var(--text-dim);text-decoration:none;font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;transition:color 0.2s;}
  .nav-links a:hover{color:var(--orange);}

  /* HERO */
  .hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden;}
  .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,107,0,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,0,0.06) 1px,transparent 1px);background-size:55px 55px;animation:grid-drift 18s linear infinite;}
  @keyframes grid-drift{0%{transform:perspective(500px) rotateX(18deg) translateY(0)}100%{transform:perspective(500px) rotateX(18deg) translateY(55px)}}
  .scanlines{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.22) 2px,rgba(0,0,0,0.22) 4px);}
  .orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;}
  .orb-1{width:420px;height:420px;background:rgba(255,107,0,0.13);top:15%;left:5%;animation:orb-float 9s ease-in-out infinite;}
  .orb-2{width:320px;height:320px;background:rgba(255,69,0,0.09);bottom:15%;right:10%;animation:orb-float 13s ease-in-out infinite reverse;}
  @keyframes orb-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-28px)}}
  .hero-content{position:relative;z-index:3;text-align:center;}
  .hero-logo-img{max-width:min(780px,88vw);filter:drop-shadow(0 0 40px rgba(255,107,0,0.5)) drop-shadow(0 0 90px rgba(255,69,0,0.25));animation:flicker 7s ease-in-out infinite;}
  @keyframes flicker{0%,88%,100%{opacity:1}90%{opacity:0.82}93%{opacity:1}96%{opacity:0.88}98%{opacity:1}}
  .hero-tagline{font-size:0.82rem;letter-spacing:7px;color:var(--orange);text-transform:uppercase;margin-top:28px;opacity:0;animation:fade-up 1s ease 0.5s forwards;}
  @keyframes fade-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .hero-buttons{display:flex;gap:14px;margin-top:44px;justify-content:center;flex-wrap:wrap;opacity:0;animation:fade-up 1s ease 0.8s forwards;}
  .btn-primary{background:var(--orange);color:var(--black);padding:16px 44px;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:4px;border:none;text-decoration:none;display:inline-block;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all 0.2s;}
  .btn-primary:hover{background:var(--orange-bright);transform:translateY(-3px);box-shadow:0 10px 36px rgba(255,107,0,0.45);}
  .btn-wishlist{background:transparent;color:var(--text);padding:16px 44px;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:4px;border:2px solid rgba(255,255,255,0.3);text-decoration:none;display:inline-flex;align-items:center;gap:10px;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all 0.2s;}
  .btn-wishlist:hover{border-color:var(--orange);color:var(--orange);transform:translateY(-3px);}
  .btn-secondary{background:transparent;color:var(--orange);padding:16px 44px;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:4px;border:2px solid var(--orange);text-decoration:none;display:inline-block;clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);transition:all 0.2s;}
  .btn-secondary:hover{background:rgba(255,107,0,0.1);transform:translateY(-3px);}
  .scroll-hint{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:fade-up 1s ease 1.4s forwards;}
  .scroll-hint span{font-size:0.62rem;letter-spacing:4px;color:var(--text-dim);}
  .scroll-line{width:1px;height:55px;background:linear-gradient(to bottom,var(--orange),transparent);animation:scroll-pulse 2s ease-in-out infinite;}
  @keyframes scroll-pulse{0%,100%{opacity:0.3;height:38px}50%{opacity:1;height:65px}}

  /* STATS */
  .stats-strip{background:var(--orange);padding:56px 60px;display:grid;grid-template-columns:repeat(4,1fr);}
  .stat{text-align:center;position:relative;}
  .stat:not(:last-child)::after{content:'';position:absolute;right:0;top:10%;bottom:10%;width:1px;background:rgba(0,0,0,0.18);}
  .stat-number{font-family:'Bebas Neue',cursive;font-size:3.8rem;color:var(--black);line-height:1;display:block;}
  .stat-label{font-size:0.65rem;letter-spacing:3px;color:rgba(0,0,0,0.55);text-transform:uppercase;margin-top:6px;}

  /* WISHLIST BANNER */
  .wishlist-banner{background:linear-gradient(135deg,#0a0a0a,#111);border-top:1px solid rgba(255,107,0,0.2);border-bottom:1px solid rgba(255,107,0,0.2);padding:60px;text-align:center;position:relative;overflow:hidden;}
  .wishlist-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,107,0,0.07) 0%,transparent 70%);pointer-events:none;}
  .wishlist-banner-inner{position:relative;z-index:1;}
  .wishlist-banner h3{font-family:'Bebas Neue',cursive;font-size:clamp(2rem,4vw,3.5rem);letter-spacing:4px;margin-bottom:10px;}
  .wishlist-banner p{font-size:0.78rem;color:var(--text-dim);letter-spacing:2px;margin-bottom:32px;}
  .btn-wishlist-big{display:inline-flex;align-items:center;gap:12px;background:var(--orange);color:var(--black);padding:18px 56px;font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:5px;text-decoration:none;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all 0.2s;}
  .btn-wishlist-big:hover{background:var(--orange-bright);transform:translateY(-3px);box-shadow:0 12px 40px rgba(255,107,0,0.4);}

  /* SECTIONS */
  section{padding:110px 60px;max-width:1400px;margin:0 auto;}
  .section-label{font-size:0.68rem;letter-spacing:6px;color:var(--orange);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
  .section-label::before{content:'';display:inline-block;width:36px;height:2px;background:var(--orange);}
  .section-title{font-family:'Bebas Neue',cursive;font-size:clamp(2.8rem,5.5vw,5.5rem);line-height:1;letter-spacing:4px;margin-bottom:56px;}

  /* FEATURES */
  .features-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
  .feature-card{background:var(--black-card);border:1px solid var(--black-border);padding:44px 36px;position:relative;overflow:hidden;transition:border-color 0.3s,transform 0.3s;}
  .feature-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform 0.4s;}
  .feature-card:hover::before{transform:scaleX(1);}
  .feature-card:hover{border-color:rgba(255,107,0,0.28);transform:translateY(-4px);}
  .feature-number{font-family:'Bebas Neue',cursive;font-size:4.5rem;color:rgba(255,107,0,0.08);line-height:1;position:absolute;top:16px;right:20px;transition:color 0.3s;}
  .feature-card:hover .feature-number{color:rgba(255,107,0,0.2);}
  .feature-icon{font-size:2.2rem;margin-bottom:18px;display:block;}
  .feature-name{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:3px;margin-bottom:10px;}
  .feature-desc{font-size:0.78rem;line-height:1.85;color:var(--text-dim);}

  /* CHARACTER */
  .character-section{display:grid;grid-template-columns:1fr 1fr;gap:100px;align-items:center;padding:110px 60px;max-width:1400px;margin:0 auto;}
  .char-visual{position:relative;display:flex;justify-content:center;align-items:center;}
  .char-img{width:260px;height:260px;object-fit:contain;filter:drop-shadow(0 0 40px rgba(255,107,0,0.6)) drop-shadow(0 0 80px rgba(255,69,0,0.3));animation:char-bob 3s ease-in-out infinite;position:relative;z-index:1;}
  @keyframes char-bob{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-14px) rotate(-3deg)}66%{transform:translateY(-6px) rotate(2deg)}}
  /* gravity flip animation on hover */
  .char-visual:hover .char-img{animation:char-flip 0.6s ease forwards;}
  @keyframes char-flip{0%{transform:rotate(0deg) scaleY(1)}50%{transform:translateY(-30px) rotate(180deg) scaleY(-1)}100%{transform:translateY(0) rotate(360deg) scaleY(1)}}
  .char-glow-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,107,0,0.18);animation:ring-pulse 3s ease-in-out infinite;}
  .char-glow-ring:nth-child(1){width:320px;height:320px;}
  .char-glow-ring:nth-child(2){width:420px;height:420px;border-color:rgba(255,107,0,0.09);animation-delay:0.5s;}
  .char-glow-ring:nth-child(3){width:520px;height:520px;border-color:rgba(255,107,0,0.04);animation-delay:1s;}
  @keyframes ring-pulse{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.04);opacity:1}}
  .char-text h2{font-family:'Bebas Neue',cursive;font-size:4.5rem;letter-spacing:4px;line-height:1;margin-bottom:22px;}
  .char-text h2 span{color:var(--orange);text-shadow:0 0 20px var(--orange-glow);}
  .char-text p{font-size:0.82rem;line-height:2;color:var(--text-dim);margin-bottom:14px;max-width:400px;}
  .char-hint{font-size:0.65rem;color:rgba(255,107,0,0.5);letter-spacing:2px;margin-top:8px;}
  .trait-list{margin-top:28px;display:flex;flex-direction:column;gap:10px;}
  .trait{display:flex;align-items:center;gap:14px;font-size:0.76rem;letter-spacing:2px;color:var(--text-dim);}
  .trait-dot{width:6px;height:6px;background:var(--orange);flex-shrink:0;box-shadow:0 0 8px var(--orange-glow);}

  /* LEVELS */
  .levels-section{background:var(--black-soft);padding:110px 0;position:relative;}
  .levels-section::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,var(--orange),transparent);}
  .levels-inner{max-width:1400px;margin:0 auto;padding:0 60px;}
  .levels-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;}
  .level-card{background:var(--black-card);border:1px solid var(--black-border);padding:36px 32px;position:relative;overflow:hidden;transition:border-color 0.3s,transform 0.3s;}
  .level-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,107,0,0.03),transparent);pointer-events:none;}
  .level-card:hover{border-color:rgba(255,107,0,0.3);transform:translateY(-4px);}
  .level-num{font-family:'Bebas Neue',cursive;font-size:5rem;color:rgba(255,107,0,0.08);line-height:1;position:absolute;top:12px;right:18px;transition:color 0.3s;}
  .level-card:hover .level-num{color:rgba(255,107,0,0.18);}
  .level-name{font-family:'Bebas Neue',cursive;font-size:1.5rem;letter-spacing:3px;margin-bottom:10px;color:var(--text);}
  .level-desc{font-size:0.76rem;line-height:1.85;color:var(--text-dim);}
  .level-tag{display:inline-block;margin-top:14px;font-size:0.6rem;letter-spacing:3px;color:var(--orange);border:1px solid rgba(255,107,0,0.3);padding:4px 10px;text-transform:uppercase;}

  /* DOWNLOAD */
  .download-section{background:var(--black-soft);padding:110px 60px;text-align:center;position:relative;overflow:hidden;border-top:1px solid var(--black-border);}
  .download-bg-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bebas Neue',cursive;font-size:18rem;color:rgba(255,107,0,0.025);letter-spacing:16px;white-space:nowrap;pointer-events:none;user-select:none;}
  .download-content{position:relative;z-index:1;}
  .download-title{font-family:'Bebas Neue',cursive;font-size:clamp(2.8rem,7vw,6.5rem);letter-spacing:6px;line-height:1;margin-bottom:18px;}
  .download-title span{color:var(--orange);text-shadow:0 0 35px var(--orange-glow);}
  .download-sub{font-size:0.78rem;letter-spacing:3px;color:var(--text-dim);margin-bottom:56px;}
  .download-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .store-btn{display:flex;align-items:center;gap:14px;background:var(--black-card);border:1px solid var(--black-border);padding:18px 36px;text-decoration:none;color:var(--text);transition:all 0.3s;position:relative;overflow:hidden;}
  .store-btn::before{content:'';position:absolute;inset:0;background:var(--orange);transform:translateX(-101%);transition:transform 0.3s ease;z-index:0;}
  .store-btn:hover::before{transform:translateX(0);}
  .store-btn:hover{color:var(--black);border-color:var(--orange);}
  .store-btn-inner{position:relative;z-index:1;text-align:left;}
  .store-btn-label{font-size:0.62rem;letter-spacing:2px;opacity:0.65;display:block;text-transform:uppercase;}
  .store-btn-name{font-family:'Bebas Neue',cursive;font-size:1.35rem;letter-spacing:3px;display:block;}
  .store-icon{font-size:1.9rem;position:relative;z-index:1;}

  /* SOCIAL LINKS */
  .social-strip{background:var(--black);padding:50px 60px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap;border-top:1px solid var(--black-border);}
  .social-btn{display:inline-flex;align-items:center;gap:10px;color:var(--text-dim);text-decoration:none;font-size:0.72rem;letter-spacing:3px;text-transform:uppercase;border:1px solid var(--black-border);padding:12px 24px;transition:all 0.2s;}
  .social-btn:hover{color:var(--orange);border-color:var(--orange);}

  /* FOOTER */
  footer{border-top:1px solid var(--black-border);padding:36px 60px;display:flex;justify-content:space-between;align-items:center;background:var(--black);}
  .footer-logo img{height:28px;opacity:0.7;filter:grayscale(1) brightness(2);}
  .footer-copy{font-size:0.65rem;color:var(--text-dim);letter-spacing:2px;}
  .footer-links{display:flex;gap:28px;list-style:none;}
  .footer-links a{color:var(--text-dim);text-decoration:none;font-size:0.65rem;letter-spacing:2px;transition:color 0.2s;}
  .footer-links a:hover{color:var(--orange);}

  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .particle{position:absolute;background:var(--orange);opacity:0;animation:particle-float linear infinite;}
  @keyframes particle-float{0%{transform:translateY(100vh) rotate(0deg);opacity:0}10%{opacity:0.5}90%{opacity:0.2}100%{transform:translateY(-80px) rotate(720deg);opacity:0}}

  @media(max-width:900px){
    nav{padding:14px 20px;} .nav-links{display:none;}
    section{padding:70px 20px;}
    .features-grid,.levels-grid{grid-template-columns:1fr;}
    .stats-strip{grid-template-columns:repeat(2,1fr);padding:36px 20px;}
    .character-section{grid-template-columns:1fr;padding:70px 20px;gap:50px;}
    .download-section,.wishlist-banner{padding:70px 20px;}
    footer{flex-direction:column;gap:18px;text-align:center;padding:28px 20px;}
    .hero-buttons{flex-direction:column;align-items:center;}
    .social-strip{padding:36px 20px;}
    .levels-inner{padding:0 20px;}
  }
</style>
</head>

<div class="particles" id="particles"></div>
