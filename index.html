<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squavity – Flip Gravity. Defy Physics.</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0d0d14;
  --deep:#111120;
  --panel:#181828;
  --border:rgba(255,255,255,0.08);
  --orange:#ff7a00;
  --orange-dim:rgba(255,122,0,0.15);
  --text:#ffffff;
  --muted:rgba(255,255,255,0.55);
}
html{scroll-behavior:smooth;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* NEW — scrolling logo */
.scroll-logo {
  width: 100%;
  text-align: center;
  padding: 6rem 0 1.5rem;
}
.scroll-logo img {
  height: 80px;
  width: auto;
}

/* NAV */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0.8rem 2rem;
  background:rgba(13,13,20,0.95);
  backdrop-filter:blur(14px);
  border-bottom:2px solid var(--orange);
}
.nav-logo img{height:36px;width:auto;}
.nav-links{display:flex;gap:1.8rem;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-weight:800;font-size:0.9rem;transition:color 0.2s;}
.nav-links a:hover{color:var(--orange);}
.nav-cta{
  background:var(--orange);color:#000;
  padding:0.5rem 1.3rem;border-radius:50px;
  font-weight:800;font-size:0.85rem;
  text-decoration:none;border:3px solid #000;
  box-shadow:3px 3px 0 #000;
  transition:transform 0.1s,box-shadow 0.1s;
}
.nav-cta:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000;}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:8rem 2rem 4rem;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse 70% 55% at 50% 50%, rgba(255,122,0,0.06) 0%, transparent 70%);
}
.hero-grid{position:absolute;inset:0;z-index:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;}
.hero>*{position:relative;z-index:1;}
.hero-badge{display:inline-block;background:var(--orange-dim);border:1px solid rgba(255,122,0,0.35);color:var(--orange);font-size:0.72rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:0.35rem 1rem;border-radius:100px;margin-bottom:1.8rem;animation:fadeUp 0.5s ease both;}
.hero-logo{max-width:min(580px,84vw);width:100%;height:auto;margin-bottom:1.8rem;animation:fadeUp 0.5s 0.1s ease both;}
.hero-tagline{font-size:clamp(1rem,2.3vw,1.2rem);color:var(--muted);max-width:500px;margin:0 auto 2.5rem;line-height:1.7;font-weight:700;animation:fadeUp 0.5s 0.2s ease both;}
.hero-buttons{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;animation:fadeUp 0.5s 0.3s ease both;}

.btn-primary{
  background:var(--orange);color:#000;
  padding:0.85rem 2rem;border-radius:50px;
  font-family:'Fredoka One',sans-serif;font-size:1.05rem;letter-spacing:0.5px;
  text-decoration:none;border:3px solid #000;
  box-shadow:4px 4px 0 #000;
  display:inline-flex;align-items:center;gap:0.4rem;
  transition:transform 0.1s,box-shadow 0.1s;
}
.btn-primary:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #000;}
.btn-primary:active{transform:translate(2px,2px);box-shadow:0 0 0 #000;}

.btn-secondary{
  background:transparent;color:var(--text);
  padding:0.85rem 2rem;border-radius:50px;
  font-family:'Fredoka One',sans-serif;font-size:1.05rem;letter-spacing:0.5px;
  text-decoration:none;border:3px solid rgba(255,255,255,0.25);
  box-shadow:4px 4px 0 rgba(255,255,255,0.1);
  display:inline-flex;align-items:center;gap:0.4rem;
  transition:transform 0.1s,border-color 0.2s;
}
.btn-secondary:hover{transform:translate(-2px,-2px);border-color:rgba(255,255,255,0.5);}

hr.div{border:none;border-top:1px solid var(--border);}

/* VIDEO */
.video-outer{padding:4rem 2rem;max-width:880px;margin:0 auto;}
.video-wrap{border-radius:12px;overflow:hidden;border:3px solid #000;box-shadow:6px 6px 0 var(--orange);aspect-ratio:16/9;}
.video-wrap iframe{width:100%;height:100%;display:block;}

/* SECTIONS */
.section{padding:5rem 2rem;max-width:1100px;margin:0 auto;}
.label{display:inline-block;background:var(--orange);color:#000;font-family:'Fredoka One',sans-serif;font-size:0.8rem;letter-spacing:1.5px;text-transform:uppercase;padding:0.3rem 1rem;border-radius:50px;border:2px solid #000;box-shadow:2px 2px 0 #000;margin-bottom:1rem;}
.section-title{font-family:'Fredoka One',sans-serif;font-size:clamp(2rem,5vw,3rem);color:#fff;margin-bottom:0.8rem;line-height:1.1;}
.section-sub{color:var(--muted);font-size:1rem;max-width:460px;line-height:1.7;margin-bottom:2.5rem;font-weight:700;}

.features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.5rem;}
.feature-card{
  background:var(--panel);border:3px solid #000;border-radius:12px;padding:1.8rem;
  box-shadow:4px 4px 0 #000;
  transition:transform 0.15s,box-shadow 0.15s;
}
.feature-card:hover{transform:translate(-3px,-3px);box-shadow:7px 7px 0 #000;}
.feature-icon{width:48px;height:48px;border-radius:10px;background:var(--orange-dim);border:2px solid var(--orange);display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:1.1rem;}
.feature-card h3{font-family:'Fredoka One',sans-serif;font-size:1.2rem;color:#fff;margin-bottom:0.5rem;}
.feature-card p{color:var(--muted);font-size:0.93rem;line-height:1.6;font-weight:700;}

.levels-bg{background:var(--deep);}
.levels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;}
.level-card{
  background:var(--panel);border:3px solid #000;border-radius:10px;
  padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem;
  box-shadow:3px 3px 0 #000;transition:transform 0.15s;
}
.level-card:hover{transform:translate(-2px,-2px);}
.level-num{font-family:'Fredoka One',sans-serif;font-size:1.8rem;color:var(--orange);line-height:1;min-width:2rem;text-shadow:2px 2px 0 #000;}
.level-name{font-family:'Fredoka One',sans-serif;font-size:1rem;color:#fff;}
.level-desc{color:var(--muted);font-size:0.78rem;margin-top:2px;font-weight:700;}
.level-boss{border-color:var(--orange);box-shadow:3px 3px 0 var(--orange);}

.platforms{padding:5rem 2rem;text-align:center;}
.platform-cards{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;margin-top:2.5rem;}
.platform-card{
  background:var(--panel);border:3px solid #000;border-radius:12px;
  padding:2rem 2.5rem;min-width:200px;text-align:center;
  text-decoration:none;color:var(--text);
  box-shadow:5px 5px 0 #000;
  transition:transform 0.15s,box-shadow 0.15s;
}
.platform-card:hover{transform:translate(-3px,-3px);box-shadow:8px 8px 0 #000;}
.platform-card .icon{font-size:2.2rem;margin-bottom:0.8rem;display:block;}
.platform-card h3{font-family:'Fredoka One',sans-serif;font-size:1.2rem;margin-bottom:0.3rem;color:#fff;}
.platform-card p{color:var(--muted);font-size:0.83rem;font-weight:700;}
.plat-steam{border-color:var(--orange);box-shadow:5px 5px 0 var(--orange);}

footer{border-top:2px solid var(--orange);padding:2rem 2.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;background:var(--deep);}
.footer-links{display:flex;gap:1.5rem;}
.footer-links a{color:var(--muted);font-size:0.83rem;text-decoration:none;font-weight:700;}
.footer-links a:hover{color:var(--orange);}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:640px){nav{padding:0.8rem 1rem;}.nav-links{display:none;}footer{flex-direction:column;align-items:flex-start;}}
</style>
</head>

<body>

<!-- NEW SCROLLING LOGO -->
<div class="scroll-logo">
  <img src="data:image/png;base64,REDACTED_FOR_LENGTH" alt="Squavity Logo">
</div>

<nav>
  <ul class="nav-links">
    <li><a href="#features">Features</a></li>
    <li><a href="#levels">Levels</a></li>
    <li><a href="#platforms">Platforms</a></li>
  </ul>

  <a class="nav-cta" href="#">Wishlist on Steam</a>
</nav>

<!-- REST OF YOUR PAGE CONTENT (unchanged) -->

</body>
</html>
